# Levanta la API sola (en el VPS se usa el compose de la raíz junto al frontend).
# Las variables salen de .env.qa (no versionado; ver .env.example).
services:
  games-api:
    build: .
    restart: unless-stopped
    env_file: .env.qa
    environment:
      - APP_ENV=qa
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
